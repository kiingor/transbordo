version: "3.8"
services:
  portal:
    image: ${PORTAL_IMAGE:?Defina PORTAL_IMAGE}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      TRUST_PROXY: ${PROXY_CIDR:?Defina PROXY_CIDR}
      PORT: 3080
      DATABASE_PATH: /app/data/portal.sqlite
      PUBLIC_URL: https://${PORTAL_DOMAIN:?Defina PORTAL_DOMAIN}
      EVOLUTION_URL: ${EVOLUTION_URL:?Defina EVOLUTION_URL}
      SIGNAL_API_ORIGIN: ${SIGNAL_API_ORIGIN:?Defina SIGNAL_API_ORIGIN}
      ENCRYPTION_KEY_FILE: /run/secrets/transbordo_encryption
      EVOLUTION_API_KEY_FILE: /run/secrets/transbordo_evolution
    networks: [proxy]
    volumes:
      - type: bind
        source: /opt/softcom-transbordo/data
        target: /app/data
    secrets:
      - source: encryption
        target: transbordo_encryption
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: evolution
        target: transbordo_evolution
        uid: "1000"
        gid: "1000"
        mode: 0400
    read_only: true
    stop_grace_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${PORTAL_NODE:?Defina PORTAL_NODE}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      labels:
        traefik.enable: "true"
        traefik.docker.network: ${PROXY_NETWORK:?Defina PROXY_NETWORK}
        traefik.http.routers.softcom-transbordo.rule: Host(`${PORTAL_DOMAIN}`)
        traefik.http.routers.softcom-transbordo.entrypoints: websecure
        traefik.http.routers.softcom-transbordo.tls.certresolver: ${TLS_RESOLVER:?Defina TLS_RESOLVER}
        traefik.http.services.softcom-transbordo.loadbalancer.server.port: "3080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
secrets:
  encryption:
    external: true
    name: softcom_transbordo_encryption_v1
  evolution:
    external: true
    name: softcom_transbordo_evolution_v1
